# Marriott tenant - org hierarchy: Chain -> Brand -> Region -> Property.
# Property instances themselves are generated by
# context_generator/multi_chain_synthetic_data.py (property_count per
# region below); this file defines the TEMPLATE/structure + guardrail
# overrides, not each property individually - keeps onboarding config-driven
# rather than requiring one hand-written block per property.

schema_version: 1
tenant_id: marriott
chain: Marriott
extends: _defaults

brands:
  - id: courtyard
    market_tier: midscale
    regions:
      - region: NYC
        cluster_id: nyc_midscale_urban
        property_count: 2
      - region: Chicago
        cluster_id: chicago_midscale_urban
        property_count: 1
  - id: ritz_carlton
    market_tier: luxury
    regions:
      - region: NYC
        cluster_id: nyc_luxury_urban
        property_count: 2
      - region: Miami
        cluster_id: miami_luxury_resort
        property_count: 1

# No overrides needed - inherits _defaults guardrails/approval/ensemble as-is.
guardrails: {}
