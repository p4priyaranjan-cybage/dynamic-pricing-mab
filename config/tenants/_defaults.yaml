# Shared defaults inherited by every tenant via `extends: _defaults`.
# Resolution order: Property > Region > Brand > Chain > this file
# (deep-merge, child wins on conflict) - bandit_engine/config_loader.py.

schema_version: 1

room_types:
  - code: standard
    multiplier: 1.0
  - code: deluxe
    multiplier: 1.15
  - code: suite
    multiplier: 1.5

rate_plans:
  - code: bar_best_available
    offset_multiplier: 1.0
    bandit_managed: true
    description: "Best Available Rate - fully dynamic, primary bandit-managed plan"
  - code: government_military
    offset_multiplier: 0.75
    bandit_managed: true
    description: "Government/Military rate - discounted, eligible for dynamic offset"
  - code: senior
    offset_multiplier: 0.85
    bandit_managed: true
    description: "Senior rate - moderate discount, eligible for dynamic offset"
  - code: special_offer
    offset_multiplier: 0.90
    bandit_managed: true
    description: "Special Offer/Promo code - slight discount, bandit adjusts timing"
  - code: corporate_negotiated
    offset_multiplier: 0.80
    bandit_managed: false
    description: "Corporate negotiated - contractual/fixed, excluded from bandit entirely"

los_curve:
  "1": 1.0
  "2": 0.98
  "3-5": 0.95
  "6-8": 0.90
  "9+": 0.85

channels:
  - direct
  - ota_mock

# Empty = inherit config/guardrails.yaml unmodified. Populate here (or in a
# brand/region block) to override specific keys only.
guardrails: {}

ensemble:
  # k in the credibility weight w_property = n_property / (n_property + k)
  # used to blend the property's own model with its cluster/tenant backbone.
  blend_smoothing_k: 20

confidence_weights:
  w_sample: 0.4
  w_agreement: 0.35
  w_margin: 0.25

# Kill-switch / fallback mode: when enabled, the bandit is bypassed and the
# API always returns the Base Rate arm (index 3, 0% offset). This gives
# revenue managers a one-click escape hatch if the model starts producing
# poor recommendations. Can be overridden per-tenant or per-property.
# Modes: "bandit" (normal), "baseline" (always Base Rate), "shadow" (score
# both but publish baseline only - see serving/api.py shadow mode).
scoring_mode: bandit
