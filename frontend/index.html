<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Pricing - Revenue Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="/css/dashboard.css" rel="stylesheet">
    <link href="/css/architecture.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon"><i class="bi bi-graph-up-arrow"></i></div>
            <span class="sidebar-brand-text">Dynamic Pricing</span>
        </div>
        <nav class="sidebar-nav">
            <a class="sidebar-link active" href="#" data-page="rate-calendar">
                <i class="bi bi-calendar3"></i>
                <span>Rate Calendar</span>
            </a>
            <a class="sidebar-link" href="#" data-page="approval-queue">
                <i class="bi bi-check2-square"></i>
                <span>Approval Queue</span>
                <span class="sidebar-badge" id="approval-count">0</span>
            </a>
            <a class="sidebar-link" href="#" data-page="recommendations">
                <i class="bi bi-calendar-range"></i>
                <span>Recommendations</span>
            </a>
            <a class="sidebar-link" href="#" data-page="scenario-sim">
                <i class="bi bi-sliders"></i>
                <span>Scenario Simulator</span>
            </a>
            <a class="sidebar-link" href="#" data-page="model-health">
                <i class="bi bi-heart-pulse"></i>
                <span>Model Health</span>
            </a>
            <a class="sidebar-link" href="#" data-page="architecture">
                <i class="bi bi-diagram-3"></i>
                <span>How It Works</span>
            </a>

            <div class="sidebar-divider"></div>
            <div class="sidebar-section-title"><span>External</span></div>

            <a class="sidebar-link" href="/ota-demo" target="_blank">
                <i class="bi bi-shop-window"></i>
                <span>OTA Demo Page</span>
                <i class="bi bi-box-arrow-up-right sidebar-external-icon"></i>
            </a>
            <a class="sidebar-link" href="http://localhost:3000" target="_blank">
                <i class="bi bi-bar-chart-line"></i>
                <span>Grafana Monitoring</span>
                <i class="bi bi-box-arrow-up-right sidebar-external-icon"></i>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Collapse sidebar">
                <i class="bi bi-chevron-double-left"></i>
            </button>
            <div class="sidebar-footer-item" id="connection-status">
                <i class="bi bi-circle-fill text-success"></i>
                <span>Connected</span>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper" id="main-wrapper">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="topbar-menu-btn" id="sidebar-toggle" title="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>
                <div class="topbar-title" id="page-title">Rate Calendar</div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button class="theme-toggle-btn" id="theme-toggle" title="Toggle dark mode">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <select class="form-select form-select-sm property-select" id="property-selector">
                    <option value="">All Properties</option>
                </select>
            </div>
        </header>

        <!-- KPI Summary Bar -->
        <div class="kpi-bar" id="kpi-bar">
            <div class="kpi-item">
                <div class="kpi-icon revenue"><i class="bi bi-currency-dollar"></i></div>
                <div class="kpi-content">
                    <div class="kpi-value" id="kpi-decisions">--</div>
                    <div class="kpi-label">Decisions Today</div>
                </div>
            </div>
            <div class="kpi-item">
                <div class="kpi-icon confidence"><i class="bi bi-shield-check"></i></div>
                <div class="kpi-content">
                    <div class="kpi-value" id="kpi-confidence">--</div>
                    <div class="kpi-label">Avg Confidence</div>
                </div>
            </div>
            <div class="kpi-item">
                <div class="kpi-icon pending"><i class="bi bi-hourglass-split"></i></div>
                <div class="kpi-content">
                    <div class="kpi-value" id="kpi-pending">--</div>
                    <div class="kpi-label">Pending Approval</div>
                </div>
            </div>
            <div class="kpi-item">
                <div class="kpi-icon autopub"><i class="bi bi-check-circle"></i></div>
                <div class="kpi-content">
                    <div class="kpi-value" id="kpi-autopub">--</div>
                    <div class="kpi-label">Auto-Published %</div>
                </div>
            </div>
            <div class="kpi-item">
                <div class="kpi-icon override"><i class="bi bi-pencil-square"></i></div>
                <div class="kpi-content">
                    <div class="kpi-value" id="kpi-override">--</div>
                    <div class="kpi-label">Override Rate</div>
                </div>
            </div>
        </div>

        <!-- Toast container for notifications -->
        <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

        <!-- Page content -->
        <div class="page-wrapper" id="main-content">
            <!-- Pages loaded here dynamically -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/pages/rate-calendar.js"></script>
    <script src="/js/pages/approval-queue.js"></script>
    <script src="/js/pages/scenario-sim.js"></script>
    <script src="/js/pages/recommendations.js"></script>
    <script src="/js/pages/model-health.js"></script>
    <script src="/js/pages/architecture.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
