<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Pricing - Revenue Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="bi bi-graph-up-arrow me-2"></i>
                <span class="fw-bold">Dynamic Pricing MAB</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-page="rate-calendar">
                            <i class="bi bi-calendar3"></i> Rate Calendar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="approval-queue">
                            <i class="bi bi-check2-square"></i> Approval Queue
                            <span class="badge bg-warning text-dark ms-1" id="approval-count">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="ota-storefront">
                            <i class="bi bi-shop"></i> OTA Storefront
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="scenario-sim">
                            <i class="bi bi-sliders"></i> Scenario Simulator
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="monitoring">
                            <i class="bi bi-bar-chart-line"></i> Monitoring
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="recommendations">
                            <i class="bi bi-calendar-range"></i> Recommendations
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="model-health">
                            <i class="bi bi-heart-pulse"></i> Model Health
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-light">
                    <small class="me-3" id="connection-status">
                        <i class="bi bi-circle-fill text-success"></i> Connected
                    </small>
                    <select class="form-select form-select-sm bg-dark text-light border-secondary" id="property-selector" style="width: 250px;">
                        <option value="">Loading properties...</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast container for notifications -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <!-- Main content area -->
    <div class="container-fluid mt-3" id="main-content">
        <!-- Pages loaded here dynamically -->
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/pages/rate-calendar.js"></script>
    <script src="js/pages/approval-queue.js"></script>
    <script src="js/pages/ota-storefront.js"></script>
    <script src="js/pages/scenario-sim.js"></script>
    <script src="js/pages/monitoring.js"></script>
    <script src="js/pages/recommendations.js"></script>
    <script src="js/pages/model-health.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
