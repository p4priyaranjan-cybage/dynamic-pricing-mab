# Prometheus scrape config for the Dynamic Pricing MAB serving API.
# Targets both compose-network and manual-run addressing (whichever isn't
# active just shows "down" on the Targets page - harmless).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pricing-api
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["api:8000", "host.containers.internal:8000"]
