# Auto-provisions the Prometheus datasource on Grafana startup - no manual
# "Add data source" click needed. URL uses the compose service network name
# (prometheus:9090) which works for both `podman-compose up` and
# `docker compose up`. If running Grafana standalone via `podman run`
# (outside compose), change this to `http://host.containers.internal:9090`.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
