# Podman/Docker Compose - POC deployment
#
# USAGE (two options):
#
# Option A (recommended for Podman on Windows):
#   1. Run the build script first:  .\scripts\build-images.ps1
#   2. Then:  podman-compose up
#   (This avoids the podman-compose `dockerfile:` bug entirely by
#   pre-building all images and referencing them by name here.)
#
# Option B (Docker Compose on Linux/Mac - no bug):
#   docker compose up --build
#
# The bootstrap service runs FIRST (generates synthetic data + trains
# models into the shared `pricing-data` volume), then exits. The api
# service waits for it via depends_on + healthcheck.
#
# Data persistence: all services share the `pricing-data` named volume
# mounted at /app/data - this is where the SQLite DB and model artifacts
# live. On Windows/Podman, a named volume avoids the bind-mount path/
# permission quirks of cross-OS mounts.

services:
  bootstrap:
    image: localhost/pricing-bootstrap
    build:
      context: .
      dockerfile: Dockerfile.trainer
    volumes:
      - pricing-data:/app/data
      - model-artifacts:/app/model_registry/artifacts
    command: ["python", "-m", "orchestration.pipelines.run_bootstrap"]

  api:
    image: localhost/pricing-api
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - pricing-data:/app/data
      - model-artifacts:/app/model_registry/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/properties', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    image: localhost/pricing-dashboard
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://api:8000
    ports:
      - "8501:8501"

  prometheus:
    image: localhost/pricing-prometheus
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"

  grafana:
    image: localhost/pricing-grafana
    build:
      context: .
      dockerfile: Dockerfile.grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"

volumes:
  pricing-data:
  model-artifacts:
